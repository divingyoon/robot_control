  - {canonical: r_hj_index_2, source: rj_dg_2_2, sign: 1, unit: rad, lower: 0.0, upper: 2.007129, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_index_3, source: rj_dg_2_3, sign: 1, unit: rad, lower: -1.570796, upper: 1.570796, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_index_4, source: rj_dg_2_4, sign: 1, unit: rad, lower: -1.570796, upper: 1.570796, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_middle_1, source: rj_dg_3_1, sign: 1, unit: rad, lower: -0.610865, upper: 0.610865, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_middle_2, source: rj_dg_3_2, sign: 1, unit: rad, lower: 0.0, upper: 1.954769, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_middle_3, source: rj_dg_3_3, sign: 1, unit: rad, lower: -1.570796, upper: 1.570796, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_middle_4, source: rj_dg_3_4, sign: 1, unit: rad, lower: -1.570796, upper: 1.570796, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_ring_1, source: rj_dg_4_1, sign: 1, unit: rad, lower: -0.610865, upper: 0.418879, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_ring_2, source: rj_dg_4_2, sign: 1, unit: rad, lower: 0.0, upper: 1.902409, velocity: 2.0, effort: 7.5}
