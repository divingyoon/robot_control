name: openarm_tesollo
components: [openarm, tesollo]
asset:
  id: openarm_tesollo_sensor_rl
  manifest: ../../../../hdgp/assets/robot/openarm_tesollo_sensor_rl/openarm_tesollo_sensor_rl_manifest.yaml
  # Re-pinned 2026-08-25 after hdgp `6d065f7` regenerated the robot USDs. That
  # commit added `requires_collision_approximation` and a
  # `self_collision_filtered_pairs` block to the manifest and changed nothing
  # else — `control_joint_order` is byte-identical across it (35 joints, both
  # sides, verified before re-pinning). Until this line was refreshed the hash
  # guard refused to load the profile at all, so `robotctl` and every profile
  # test errored out; the guard did its job, nobody had re-pinned.
  manifest_sha256: ef802c059f1c3e57c7e652a7333c8b29c29c289bb04460414ae6e58c287244dc
  # The asset's own canonical-named URDF (r_aj_1...), whose masses include the
  # mounted hand — pass it to --urdf wherever the bringup description's vendor
  # masses are wrong for the arm as built.
  urdf: ../../../../hdgp/assets/robot/openarm_tesollo_sensor_rl/openarm_tesollo_sensor_rl.urdf
ros:
  humble:
    command_topic: /robot_control/openarm_tesollo/command
    state_topic: /robot_control/openarm_tesollo/state
    controller: openarm_tesollo_canonical_controller
    command_rate_hz: 100
  jazzy:
    command_topic: /robot_control/openarm_tesollo/command
    state_topic: /robot_control/openarm_tesollo/state
    controller: openarm_tesollo_canonical_controller
    command_rate_hz: 100
# A group is executable only if it names a controller. `moveit_group` names the
# SRDF planning group used for IK and FK, and `tip_link` the frame those solve
# for; groups without them are reachable by direct joint values only. `action`
# defaults to follow_joint_trajectory. `hdgp_group` names the same joints in
# hdgp's `actuators={...}` dict, which spells the hand groups differently; a
# calibration exported under the wrong name is applied as the env's default and
# reports nothing.
groups:
  openarm_right_arm:
    joints: [r_aj_1, r_aj_2, r_aj_3, r_aj_4, r_aj_5, r_aj_6, r_aj_7]
    hdgp_group: openarm_right_arm
    controller: right_joint_trajectory_controller
    moveit_group: right_arm
    tip_link: openarm_right_hand_tcp
    # Where the chain ends in the asset URDF: the Tesollo palm's EE frame.
    asset_tip_link: r_hl_palm_ee
    effort_controller: right_forward_effort_controller
  openarm_left_arm:
    joints: [l_aj_1, l_aj_2, l_aj_3, l_aj_4, l_aj_5, l_aj_6, l_aj_7]
    hdgp_group: openarm_left_arm
    controller: left_joint_trajectory_controller
    moveit_group: left_arm
    tip_link: openarm_left_hand_tcp
    # Where the chain ends in the asset URDF: the left gripper's TCP.
    asset_tip_link: l_hl_gripper_tcp
    effort_controller: left_forward_effort_controller
  # Humble ships no parallel_gripper_action_controller, and this branch's
  # vendored configuration runs left_gripper_controller as a
  # JointTrajectoryController. One action for every end effector — the two-finger
  # gripper and the multi-finger hands alike — is what this distribution can
  # actually serve.
  openarm_left_gripper:
    joints: [l_hj_gripper_1]
    hdgp_group: openarm_left_gripper
    controller: left_gripper_controller
    moveit_group: left_gripper
    action: follow_joint_trajectory
  # The hand is not part of the arm bringup. dg5f_right_driver.launch.py brings
  # up a controller_manager of its own under the namespace `dg5f_right`, so both
  # the action and the joint states live one level down — and the hand's joints
  # never appear on the robot-wide /joint_states at all. `joint_trajectory_
  # controller`, the name these groups carried before, belongs to the Gazebo
  # configuration; on hardware nothing serves it.
  #
  # The controller takes all twenty joints and allows a partial goal, which is
  # what lets one phalanx be commanded on its own. The split is by phalanx
  # rather than by finger because that is how hdgp groups the same joints, and
  # a calibration measured here is exported under those names.
  tesollo_abduction:
    joints: [r_hj_thumb_1, r_hj_index_1, r_hj_middle_1, r_hj_ring_1, r_hj_pinky_1]
    hdgp_group: tesollo_hand_abduction
    controller: dg5f_right/dg5f_right_controller
    state_topic: /dg5f_right/joint_states
  tesollo_curl:
    joints: [r_hj_thumb_2, r_hj_index_2, r_hj_middle_2, r_hj_ring_2, r_hj_pinky_2]
    hdgp_group: tesollo_hand_curl
    controller: dg5f_right/dg5f_right_controller
    state_topic: /dg5f_right/joint_states
  tesollo_pip:
    joints: [r_hj_thumb_3, r_hj_index_3, r_hj_middle_3, r_hj_ring_3, r_hj_pinky_3]
    hdgp_group: tesollo_hand_pip
    controller: dg5f_right/dg5f_right_controller
    state_topic: /dg5f_right/joint_states
  tesollo_dip:
    joints: [r_hj_thumb_4, r_hj_index_4, r_hj_middle_4, r_hj_ring_4, r_hj_pinky_4]
    hdgp_group: tesollo_hand_dip
    controller: dg5f_right/dg5f_right_controller
    state_topic: /dg5f_right/joint_states
joints:
  - {canonical: r_aj_1, source: openarm_right_joint1, sign: 1, unit: rad, lower: -1.39626, upper: 3.49066, velocity: 2.0, effort: 40}
  - {canonical: r_aj_2, source: openarm_right_joint2, sign: 1, unit: rad, lower: -0.174533, upper: 3.31612, velocity: 2.0, effort: 40}
  - {canonical: r_aj_3, source: openarm_right_joint3, sign: 1, unit: rad, lower: -1.5708, upper: 1.5708, velocity: 2.0, effort: 27}
  - {canonical: r_aj_4, source: openarm_right_joint4, sign: 1, unit: rad, lower: 0, upper: 2.44346, velocity: 2.0, effort: 27}
  - {canonical: r_aj_5, source: openarm_right_joint5, sign: 1, unit: rad, lower: -1.5708, upper: 1.5708, velocity: 2.0, effort: 7}
  - {canonical: r_aj_6, source: openarm_right_joint6, sign: 1, unit: rad, lower: -0.785398, upper: 0.785398, velocity: 2.0, effort: 7}
  - {canonical: r_aj_7, source: openarm_right_joint7, sign: 1, unit: rad, lower: -1.5708, upper: 1.5708, velocity: 2.0, effort: 7}
  - {canonical: l_aj_1, source: openarm_left_joint1, sign: 1, unit: rad, lower: -3.49066, upper: 1.39626, velocity: 2.0, effort: 40}
  - {canonical: l_aj_2, source: openarm_left_joint2, sign: 1, unit: rad, lower: -3.31612, upper: 0.174533, velocity: 2.0, effort: 40}
  - {canonical: l_aj_3, source: openarm_left_joint3, sign: 1, unit: rad, lower: -1.5708, upper: 1.5708, velocity: 2.0, effort: 27}
  - {canonical: l_aj_4, source: openarm_left_joint4, sign: 1, unit: rad, lower: 0, upper: 2.44346, velocity: 2.0, effort: 27}
  - {canonical: l_aj_5, source: openarm_left_joint5, sign: 1, unit: rad, lower: -1.5708, upper: 1.5708, velocity: 2.0, effort: 7}
  - {canonical: l_aj_6, source: openarm_left_joint6, sign: 1, unit: rad, lower: -0.785398, upper: 0.785398, velocity: 2.0, effort: 7}
  - {canonical: l_aj_7, source: openarm_left_joint7, sign: 1, unit: rad, lower: -1.5708, upper: 1.5708, velocity: 2.0, effort: 7}
  # Prismatic in metres, declared `rad` because `profile.py` accepts no other
  # unit; the numbers here are metres. The stroke is the description's own
  # 0.044 (openarm_hand.xacro finger_joint1) — it read 0.04 until 2026-08-25,
  # and since the bridge clamps into the profile that shortfall could only
  # surface as a grip 4 mm narrower than the policy asked for, never as an
  # error. Effort and velocity stay well under the rated 333 / 10.0, as the
  # arm's do. `l_hj_gripper_2` is absent on purpose: the real URDF still mimics
  # it off joint 1 (the sim USD is the one that lost the mimic and has to drive
  # both jaws).
  - {canonical: l_hj_gripper_1, source: openarm_left_finger_joint1, sign: 1, unit: rad, lower: 0.0, upper: 0.044, velocity: 0.2, effort: 20}
  # Ranges and effort from dg_description/urdf/dg5f_right.urdf, which the asset
  # URDF agrees with joint for joint. They are not symmetric: the thumb's second
  # joint only travels negative and the other fingers' only positive, so the
  # +-1.5 placeholder these carried authorized a curl command that drove four
  # fingers into their stops. Velocity is held at the arm's conservative 2.0
  # rather than the described 3.14, on the same reasoning as the arm.
  - {canonical: r_hj_thumb_1, source: rj_dg_1_1, sign: 1, unit: rad, lower: -0.383972, upper: 0.890118, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_thumb_2, source: rj_dg_1_2, sign: 1, unit: rad, lower: -3.141593, upper: 0.0, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_thumb_3, source: rj_dg_1_3, sign: 1, unit: rad, lower: -1.570796, upper: 1.570796, velocity: 2.0, effort: 7.5}
  - {canonical: r_hj_thumb_4, source: rj_dg_1_4, sign: 1, unit: rad, lower: -1.570796, upper: 1.570796, velocity: 2.0, effort: 7.5}
