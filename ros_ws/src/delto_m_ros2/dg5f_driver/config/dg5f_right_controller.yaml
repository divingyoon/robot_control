/**/controller_manager:
  ros__parameters:
    update_rate: 100 # Joint state pub rate
    diagnostics:
      threshold:
        controller_manager:
          periodicity:
            mean_error:
              warn: 1.0
              error: 10.0
            standard_deviation:
              warn: 1.0
              error: 10.0
        controllers:
          execution_time:
            mean_error:
              warn: 10.0
              error: 2000.0
            standard_deviation:
              warn: 10.0
              error: 200.0
          periodicity:
            mean_error:
              warn: 1.0
              error: 10.0
            standard_deviation:
              warn: 1.0
              error: 10.0
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    dg5f_right_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/dg5f_right_controller:
  ros__parameters:
    state_publish_rate: 500.0 # 50Hz에서 500Hz로 변경
    action_monitor_rate: 500.0 # 20Hz에서 500Hz로 변경
    allow_nonzero_velocity_at_trajectory_end: false
    allow_partial_joints_goal: true

    joints:
      - rj_dg_1_1
      - rj_dg_1_2
      - rj_dg_1_3
      - rj_dg_1_4
      - rj_dg_2_1
      - rj_dg_2_2
      - rj_dg_2_3
      - rj_dg_2_4
      - rj_dg_3_1
      - rj_dg_3_2
      - rj_dg_3_3
      - rj_dg_3_4
      - rj_dg_4_1
      - rj_dg_4_2
      - rj_dg_4_3
      - rj_dg_4_4
      - rj_dg_5_1
      - rj_dg_5_2
      - rj_dg_5_3
      - rj_dg_5_4

    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    # p = 벤더 기본 1.5. ★2026-09-06 사용자 확정: 학습·제어 전부 벤더 게인만 쓴다.
    #   구 실기 튜닝 p=4.5 (2026-09-01)는 폐기됐다 — 좌손·both·pid_all config 는 전부 1.5 인데
    #   이 파일만 4.5 로 남아 있었다(2026-09-07 정정).
    #   폐기된 측정 기록(참고): 벤더 1.5 는 4 s 램프 주먹에서 지령의 82 %, 4.5 는 98~101 %.
    #   p=6 부터 다관절 진동 시작(σ 0.099 → 0.160°). ⚠파지력·도달률은 1.5 기준으로 재확인 대상.
    #   i · d · i_clamp · ff_velocity_scale 은 벤더값 그대로.
    gains:
      rj_dg_1_1:
        p: 1.5
        i: 0.0
        d: 0.0
        i_clamp_max: 0.0
        i_clamp_min: 0.0
        ff_velocity_scale: 0.0001
      rj_dg_1_2:
        p: 1.5
